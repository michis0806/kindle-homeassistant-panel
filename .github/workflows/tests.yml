name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install --require-hashes -r kindle_panel/requirements.txt
      - run: python -m unittest discover -s kindle_panel -p 'test_*.py'
      - run: node kindle_panel/test_layout.js
      - run: node kindle_panel/test_panel.js && node kindle_panel/test_live.js
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node tests/kindle/test_native_start.js
      - run: python tests/kindle/test_light_off.py && python tests/kindle/test_visible_exit.py
      - run: for file in kindle/HAKiosk/*.sh kindle/HAKiosk/tools/*; do sh -n "$file"; done
